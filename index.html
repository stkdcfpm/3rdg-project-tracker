<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3RDG Project Tracker</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg:#f5f4f0;--surface:#fff;--surface-2:#f9f9f8;
    --border:rgba(11,11,11,.10);--border-strong:rgba(11,11,11,.20);
    --text:#0b0b0b;--text-sec:#52514e;--text-muted:#898781;
    --radius:8px;--accent:#185fa5;
  }
  @media(prefers-color-scheme:dark){:root{
    --bg:#141413;--surface:#1e1e1c;--surface-2:#252523;
    --border:rgba(255,255,255,.10);--border-strong:rgba(255,255,255,.20);
    --text:#f5f4f0;--text-sec:#b0afa8;--text-muted:#6e6d69;--accent:#3987e5;
  }}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px;min-height:100vh;}
  .topbar{background:var(--surface);border-bottom:.5px solid var(--border);padding:0 1.5rem;display:flex;align-items:center;justify-content:space-between;height:52px;position:sticky;top:0;z-index:50;}
  .brand{font-size:14px;font-weight:500;} .sub{font-size:11px;color:var(--text-muted);}
  .topbar-r{display:flex;align-items:center;gap:8px;}
  .dot{width:7px;height:7px;border-radius:50%;background:#898781;display:inline-block;margin-right:4px;transition:background .3s;}
  .dot.ok{background:#639922;} .dot.err{background:#e24b4a;}
  .stext{font-size:12px;color:var(--text-muted);}
  .btn{padding:6px 14px;border:.5px solid var(--border-strong);border-radius:var(--radius);font-size:13px;cursor:pointer;background:var(--surface);color:var(--text);font-family:inherit;display:inline-flex;align-items:center;gap:5px;white-space:nowrap;transition:background .12s;}
  .btn:hover{background:var(--surface-2);} .btn.primary{background:var(--text);color:var(--surface);border-color:transparent;} .btn.primary:hover{opacity:.85;} .btn:disabled{opacity:.4;cursor:default;}
  .layout{display:flex;height:calc(100vh - 52px);}
  .sidebar{width:210px;flex-shrink:0;background:var(--surface);border-right:.5px solid var(--border);padding:1rem 0;overflow-y:auto;}
  .slabel{font-size:10px;font-weight:500;letter-spacing:.08em;color:var(--text-muted);text-transform:uppercase;padding:0 1rem 6px;}
  .titem{display:flex;align-items:center;justify-content:space-between;padding:8px 1rem;cursor:pointer;font-size:13px;color:var(--text-sec);border-left:2px solid transparent;transition:all .12s;user-select:none;}
  .titem:hover{background:var(--surface-2);color:var(--text);}
  .titem.active{color:var(--text);font-weight:500;border-left-color:var(--text);background:var(--surface-2);}
  .titem.section-header{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted);padding:12px 1rem 4px;cursor:default;border-left:none;}
  .titem.section-header:hover{background:transparent;color:var(--text-muted);}
  .tcount{font-size:11px;color:var(--text-muted);background:var(--bg);padding:1px 6px;border-radius:10px;}
  .main{flex:1;overflow-y:auto;padding:1.5rem;}
  .toolbar{display:flex;align-items:center;gap:8px;margin-bottom:1rem;flex-wrap:wrap;}
  .search{flex:1;min-width:180px;max-width:320px;padding:7px 12px;border:.5px solid var(--border-strong);border-radius:var(--radius);font-size:13px;background:var(--surface);color:var(--text);font-family:inherit;}
  .search:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent;}
  .ttitle{font-size:15px;font-weight:500;flex:1;} .rcount{font-size:12px;color:var(--text-muted);}
  .twrap{background:var(--surface);border:.5px solid var(--border);border-radius:12px;overflow:hidden;}
  .tscroll{overflow-x:auto;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  thead th{padding:9px 12px;text-align:left;font-weight:500;font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;border-bottom:.5px solid var(--border);background:var(--surface-2);white-space:nowrap;}
  tbody tr{border-bottom:.5px solid var(--border);} tbody tr:last-child{border-bottom:none;} tbody tr:hover{background:var(--surface-2);}
  tbody td{padding:9px 12px;vertical-align:top;line-height:1.5;}
  .ctext{max-width:260px;word-break:break-word;} .cnarrow{white-space:nowrap;}
  .badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:500;white-space:nowrap;}
  .b-paid{background:#eaf3de;color:#3b6d11;} .b-hold{background:#faeeda;color:#854f0b;}
  .b-pending{background:#e6f1fb;color:#185fa5;} .b-urgent{background:#fcebeb;color:#a32d2d;}
  .b-progress{background:#eeedfe;color:#534ab7;} .b-closed{background:#e1f5ee;color:#0f6e56;}
  .b-evidence{background:#faeeda;color:#854f0b;} .b-breach{background:#fcebeb;color:#a32d2d;}
  .b-claimable{background:#eaf3de;color:#3b6d11;} .b-confirmed{background:#e1f5ee;color:#0f6e56;}
  .b-forecast{background:#eeedfe;color:#534ab7;} .b-default{background:var(--surface-2);color:var(--text-sec);border:.5px solid var(--border);}
  .ract{display:flex;gap:4px;white-space:nowrap;}
  .ibtn{padding:3px 8px;border:.5px solid var(--border);border-radius:4px;background:none;cursor:pointer;font-size:12px;color:var(--text-sec);font-family:inherit;transition:background .1s;}
  .ibtn:hover{background:var(--surface-2);color:var(--text);} .ibtn.del:hover{background:#fff0f0;color:#e24b4a;border-color:#f09595;}
  .empty{padding:3rem;text-align:center;color:var(--text-muted);font-size:13px;}
  .errbanner{padding:10px 14px;background:#fcebeb;border:.5px solid #f09595;border-radius:var(--radius);color:#a32d2d;font-size:13px;margin-bottom:1rem;display:none;}
  .overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;align-items:center;justify-content:center;padding:1rem;}
  .overlay.open{display:flex;}
  .modal{background:var(--surface);border-radius:12px;border:.5px solid var(--border);padding:1.5rem;width:100%;max-width:560px;max-height:85vh;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,.18);}
  .mhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem;}
  .mhead h2{font-size:15px;font-weight:500;}
  .mcls{background:none;border:none;cursor:pointer;font-size:20px;color:var(--text-muted);padding:2px 6px;border-radius:4px;}
  .mcls:hover{background:var(--surface-2);}
  .fields{display:flex;flex-direction:column;gap:12px;}
  .field{display:flex;flex-direction:column;gap:5px;}
  .field label{font-size:12px;font-weight:500;color:var(--text-sec);}
  .field input,.field textarea{padding:8px 10px;border:.5px solid var(--border-strong);border-radius:var(--radius);font-size:13px;background:var(--surface);color:var(--text);font-family:inherit;width:100%;}
  .field input:focus,.field textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent;}
  .field textarea{resize:vertical;min-height:72px;}
  .mfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:1.25rem;padding-top:1rem;border-top:.5px solid var(--border);}
  .toast{position:fixed;bottom:1.5rem;right:1.5rem;background:var(--text);color:var(--surface);padding:10px 16px;border-radius:var(--radius);font-size:13px;z-index:999;opacity:0;transform:translateY(8px);transition:opacity .2s,transform .2s;pointer-events:none;}
  .toast.show{opacity:1;transform:translateY(0);} .toast.err{background:#a32d2d;}
</style>
</head>
<body>
<div class="topbar">
  <div><div class="brand">3RDG Project Tracker</div><div class="sub">3 Ridgeside Avenue · Brighton BN1 8WD</div></div>
  <div class="topbar-r">
    <span class="dot" id="dot"></span><span class="stext" id="stext">Connecting...</span>
    <button class="btn" onclick="loadAll()" id="refBtn">&#8635; Refresh</button>
  </div>
</div>
<div class="layout">
  <nav class="sidebar"><div id="sidebar"></div></nav>
  <main class="main">
    <div id="errbanner" class="errbanner"></div>
    <div class="toolbar">
      <span class="ttitle" id="ttitle">Loading...</span>
      <input class="search" type="search" id="search" placeholder="Search rows..." oninput="render()">
      <span class="rcount" id="rcount"></span>
      <button class="btn primary" onclick="openAdd()">+ Add row</button>
    </div>
    <div id="tc"><div class="empty">Connecting to Google Sheets&hellip;</div></div>
  </main>
</div>
<div class="overlay" id="overlay" onclick="bgClick(event)">
  <div class="modal">
    <div class="mhead"><h2 id="mtitle">Add row</h2><button class="mcls" onclick="closeModal()">&times;</button></div>
    <div class="fields" id="mfields"></div>
    <div class="mfoot"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" id="saveBtn" onclick="saveRow()">Save</button></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
const ENDPOINT = 'https://script.google.com/macros/s/AKfycbywfGxlviMvz0mWe-LRrKx3kxtD-wWAOOJe4trQ6qTL7cwy0BSnD9HWOXAKzJU6eCDJxQ/exec';
const TOKEN = '3RDG_TRACKER_2026';

// Tab groups for sidebar
const TAB_GROUPS = [
  { label: 'Project', tabs: ['DECISIONS LOG','ACTIONS & OPEN ITEMS'] },
  { label: 'Finance', tabs: ['PAYMENTS LOG','BUDGET','PHASE 2 TRACKER'] },
  { label: 'Procurement', tabs: ['FIXTURES & FINISHES'] },
  { label: 'Other', tabs: ['SWater'] },
];
const TABS = TAB_GROUPS.flatMap(g => g.tabs);

const KEYCOL = {};
const STATCOL = {};
TABS.forEach(t => { KEYCOL[t] = 'Item'; STATCOL[t] = 'Status'; });
STATCOL['DECISIONS LOG'] = null;

const LONGCOLS = ['Decision','Notes','Detail','Source','Spec / Notes','Notes'];

let data={}, cur=TABS[0], editing=null;

async function apiGet(tab) {
  const url = ENDPOINT + '?action=api&token=' + encodeURIComponent(TOKEN) + '&tab=' + encodeURIComponent(tab);
  const r = await fetch(url, {redirect:'follow'});
  const text = await r.text();
  try { return JSON.parse(text); }
  catch(e) { throw new Error('Non-JSON response — check Apps Script deployment. Detail: ' + text.slice(0,120)); }
}

async function apiPost(body) {
  const r = await fetch(ENDPOINT, {
    method:'POST', headers:{'Content-Type':'text/plain'},
    body: JSON.stringify({...body, token: TOKEN}), redirect:'follow'
  });
  const text = await r.text();
  try { return JSON.parse(text); }
  catch(e) { throw new Error('Save failed: ' + text.slice(0,120)); }
}

async function loadAll() {
  setS(''); document.getElementById('refBtn').disabled=true; hideErr();
  try {
    for (const t of TABS) {
      try {
        const r = await apiGet(t);
        if (r.success) data[t]=r;
      } catch(e) { /* tab may not exist yet — skip silently */ }
    }
    renderSidebar(); render(); setS('ok');
  } catch(e) { setS('err'); showErr(e.message); }
  document.getElementById('refBtn').disabled=false;
}

function setS(s) {
  const d=document.getElementById('dot'), t=document.getElementById('stext');
  d.className='dot'+(s==='ok'?' ok':s==='err'?' err':'');
  t.textContent = s==='ok' ? 'Connected \u00b7 '+new Date().toLocaleTimeString() : s==='err' ? 'Connection error' : 'Loading\u2026';
}

function renderSidebar() {
  let html = '';
  TAB_GROUPS.forEach(g => {
    html += '<div class="titem section-header">'+g.label+'</div>';
    g.tabs.forEach(t => {
      const count = data[t] ? data[t].rows.length : '\u2013';
      html += '<div class="titem '+(t===cur?'active':'')+'" onclick="switchTab(\''+t+'\')"><span>'+t+'</span><span class="tcount">'+count+'</span></div>';
    });
  });
  document.getElementById('sidebar').innerHTML = html;
}

function switchTab(t){cur=t;document.getElementById('search').value='';renderSidebar();render();}

function bc(v){
  if(!v)return'b-default';const u=v.toString().toUpperCase();
  if(u.includes('PAID'))return'b-paid';
  if(u.includes('ON HOLD'))return'b-hold';
  if(u.includes('URGENT'))return'b-urgent';
  if(u.includes('IN PROGRESS'))return'b-progress';
  if(u.includes('CLOSED'))return'b-closed';
  if(u.includes('CONFIRMED'))return'b-confirmed';
  if(u.includes('FORECAST'))return'b-forecast';
  if(u.includes('EVIDENCE'))return'b-evidence';
  if(u.includes('BREACH'))return'b-breach';
  if(u.includes('CLAIMABLE'))return'b-claimable';
  if(u.includes('PENDING'))return'b-pending';
  if(u.includes('DECISION'))return'b-urgent';
  return'b-default';
}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function fmt(n){return'\u00a3'+Math.abs(parseFloat(n)||0).toLocaleString('en-GB',{minimumFractionDigits:0,maximumFractionDigits:0});}
function parsePound(v){return parseFloat(String(v||'').replace(/[\u00a3,]/g,''))||0;}

// ── BUDGET DASHBOARD ──────────────────────────────────────────────────────
function renderBudgetDashboard() {
  // Phase 1 — ground floor (from reconciliation 26 Aug 2026)
  const p1_contract_net  = 100600;
  const p1_contract_vat  = 120720;
  const p1_claimed_net   = 60685.75;  // Apps 1–6
  const p1_remaining_net = p1_contract_net - p1_claimed_net;  // 39,914.25
  const p1_paid_vat      = 72822.90;  // Apps 1–6 all paid inc VAT

  // App 7 pending (windows)
  const app7_net = 6275;
  const app7_vat = 7530;

  // Phase 2 — 1st floor & loft (quote issued 02 Mar 2026, not started)
  const p2_contract_net  = 203874;
  const p2_contract_vat  = 244648.80;

  // Other client-supply costs
  const kitchen_store_total  = 35000;
  const kitchen_store_paid   = 8750;   // 25% deposit (10% + 15%)
  const kitchen_store_remain = 26250;
  const rooflights           = 2434;
  const ff_midpoint          = 13385 + 19.95 - 875 - 800 - 1050 - 2350 + 764.10 + 989.10 + 1709.10 + 999.00; // updated with confirmed appliances
  const ff_adjusted          = 12765.25; // recalculated F&F with confirmed appliances

  // Totals
  const totalBudget = p1_contract_vat + kitchen_store_total + rooflights + ff_adjusted;
  // = 120,720 + 35,000 + 2,434 + 12,765 = ~170,919 (matches prior calc approx)

  const totalPaid      = p1_paid_vat + kitchen_store_paid;  // 72,823 + 8,750
  const totalCommitted = app7_vat + kitchen_store_remain + rooflights; // 7,530 + 26,250 + 2,434
  const totalSpend     = totalPaid + totalCommitted;
  const allocatedUnspent = p1_remaining_net - app7_net + ff_adjusted; // ~33,639 + 12,765

  // Phase 2 is separate — not yet in budget
  const p2_not_budgeted = p2_contract_vat;

  const contingency = (totalBudget - totalSpend) * 0.10;
  const forecastP1  = totalSpend + allocatedUnspent + contingency;
  const variance    = totalBudget - forecastP1;

  const pPaid      = Math.min(totalPaid/totalBudget*100, 100);
  const pCommitted = Math.min(totalCommitted/totalBudget*100, 100-pPaid);
  const pAlloc     = Math.min(allocatedUnspent/totalBudget*100, 100-pPaid-pCommitted);
  const pFree      = Math.max(100-pPaid-pCommitted-pAlloc, 0);

  const card = (label, value, sub, color) =>
    `<div style="background:var(--surface);border:.5px solid var(--border);border-radius:12px;padding:.875rem 1rem;min-width:120px;flex:1;">
      <div style="font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px;">${label}</div>
      <div style="font-size:18px;font-weight:500;color:${color||'var(--text)'};">${fmt(value)}</div>
      ${sub?`<div style="font-size:11px;color:var(--text-muted);margin-top:2px;">${sub}</div>`:''}
    </div>`;

  const divider = label =>
    `<div style="font-size:10px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.08em;margin:1rem 0 6px;">${label}</div>`;

  const bar = `<div style="background:var(--surface);border:.5px solid var(--border);border-radius:12px;padding:1rem 1.25rem;margin-bottom:1rem;">
    <div style="font-size:11px;font-weight:500;margin-bottom:10px;">Phase 1 budget ${fmt(totalBudget)} <span style="color:var(--text-muted);font-weight:400;font-size:11px;">· Phase 2 ${fmt(p2_contract_vat)} not yet budgeted</span></div>
    <div style="display:flex;border-radius:4px;height:10px;overflow:hidden;gap:1px;">
      <div style="background:#639922;width:${pPaid.toFixed(1)}%;" title="Paid"></div>
      <div style="background:#d4820a;width:${pCommitted.toFixed(1)}%;" title="Committed"></div>
      <div style="background:#3987e5;width:${pAlloc.toFixed(1)}%;" title="Allocated"></div>
      <div style="background:var(--border);flex:1;" title="Free"></div>
    </div>
    <div style="display:flex;gap:16px;margin-top:8px;flex-wrap:wrap;">
      <span style="font-size:11px;color:#639922;">&#9632; Paid ${pPaid.toFixed(0)}%</span>
      <span style="font-size:11px;color:#d4820a;">&#9632; Committed ${pCommitted.toFixed(0)}%</span>
      <span style="font-size:11px;color:#3987e5;">&#9632; Allocated ${pAlloc.toFixed(0)}%</span>
      <span style="font-size:11px;color:var(--text-muted);">&#9632; Free ${pFree.toFixed(0)}%</span>
    </div>
  </div>`;

  // Phase 2 panel
  const p2panel = `<div style="background:#eeedfe;border:.5px solid #c5c1f5;border-radius:12px;padding:1rem 1.25rem;margin-bottom:1rem;">
    <div style="font-size:11px;font-weight:600;color:#534ab7;margin-bottom:10px;">PHASE 2 — 1ST FLOOR &amp; LOFT (NOT STARTED)</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;">
      ${card('Contract value (net)', p2_contract_net, 'Quote issued 02 Mar 2026','#534ab7')}
      ${card('Total inc VAT', p2_contract_vat, 'Not yet budgeted','#534ab7')}
      ${card('Paid to date', 0, 'No applications raised','var(--text-muted)')}
      ${card('Status', 0, 'Planning/BC in progress','var(--text-muted)')}
    </div>
    <div style="font-size:11px;color:#534ab7;margin-top:10px;line-height:1.6;">
      Provisional sums: Plumbing 1st fix (£4,000), Heating (£5,000), Electrical 1st &amp; 2nd fix (£6,000) — expect uplifts as per Phase 1 pattern.<br>
      Excluded: bathroom sanitaryware, floor finishes, wardrobes. Fitting included.<br>
      Biggest items: Scaffolding £22,800 · Roof Covering £20,380 · Plastering £21,100 · Decorating £10,925.
    </div>
  </div>`;

  return `<div style="margin-bottom:1.25rem;">
    ${bar}
    ${divider('Phase 1 cash out')}
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;">
      ${card('Paid to date', totalPaid, 'Apps 1–6 + Kitchen Store 25%', '#639922')}
      ${card('Committed unpaid', totalCommitted, 'App 7 + Kitchen Store bal + rooflights', '#d4820a')}
      ${card('Total cash out', totalSpend, 'paid + committed')}
    </div>
    ${divider('Phase 1 budget position')}
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;">
      ${card('Allocated unspent', allocatedUnspent, 'Kymarn Apps 8+ + F&F', '#3987e5')}
      ${card('10% contingency', contingency, 'on unspent balance', '#52514e')}
      ${card('Variance vs budget', variance, variance<0?'OVER BUDGET':'UNDER BUDGET', variance<0?'#a32d2d':'#3b6d11')}
    </div>
    ${p2panel}
    <div style="background:#faeeda;border:.5px solid #e8c97a;border-radius:10px;padding:.875rem 1rem;font-size:12px;line-height:1.6;color:#5a3e00;">
      <strong>&#9888; Sensitivity note</strong> — Phase 1 variance is estimate-based. Three risks: (1) Kitchen Store final figure may move from £35,000; (2) F&amp;F midpoints are not fixed quotes; (3) P&amp;H and Electrics provisional sums may uplift further in later applications.<br>
      <strong>Phase 2 (£244,649 inc VAT) is entirely unbudgeted</strong> and subject to planning approval. Total project exposure: <strong>£365,369 inc VAT</strong> across both phases before client-supply items.
    </div>
  </div>`;
}

// ── PHASE 2 TRACKER DASHBOARD ─────────────────────────────────────────────
function renderPhase2Dashboard() {
  const lines = [
    ['Pre lims',11000],['Demolitions',8500],['Drainage',0],
    ['Timber Framing',9750],['Superstructure Masonry',14300],
    ['First Floor',1950],['Second Floor',5650],['Steelwork',8500],
    ['Dormers',1850],['Roof Structure',14650],['Roof Covering',20380],
    ['Sun & Roof Lights',3250],['Internal Timber Partitions',12115],
    ['Rainwater Goods',1650],['Windows & External Doors',7786],
    ['External Cladding',768],['Electrical 1st Fix*',4000],
    ['Plumbing 1st Fix*',4000],['Plastering, insulation & drylining',21100],
    ['2nd Fix Joinery',9950],['Heating*',5000],
    ['Electrical 2nd Fix*',2000],['Plumbing 2nd Fix*',2000],
    ['Decorating',10925],['Scaffolding',22800],
  ];
  const total = lines.reduce((s,[,v])=>s+v,0);
  const rows = lines.map(([name,val])=>{
    const prov = name.endsWith('*');
    return `<tr>
      <td style="padding:7px 10px;border-bottom:.5px solid var(--border);font-size:13px;">${esc(name.replace('*',''))}${prov?` <span style="font-size:10px;color:var(--text-muted);">(provisional)</span>`:''}</td>
      <td style="padding:7px 10px;border-bottom:.5px solid var(--border);font-size:13px;text-align:right;white-space:nowrap;">${val===0?'TBC':'\u00a3'+val.toLocaleString('en-GB')}</td>
      <td style="padding:7px 10px;border-bottom:.5px solid var(--border);font-size:13px;text-align:right;white-space:nowrap;">0%</td>
    </tr>`;
  }).join('');

  return `<div style="margin-bottom:1.25rem;">
    <div style="background:#eeedfe;border:.5px solid #c5c1f5;border-radius:12px;padding:1rem 1.25rem;margin-bottom:1rem;">
      <div style="font-size:13px;font-weight:500;color:#534ab7;margin-bottom:4px;">Phase 2 — 1st Floor &amp; Loft Works</div>
      <div style="font-size:12px;color:#534ab7;line-height:1.6;">Status: <strong>NOT STARTED</strong> &nbsp;·&nbsp; Quote issued 02 Mar 2026 &nbsp;·&nbsp; Planning/BC in progress<br>
      Total: <strong>\u00a3203,874 net / \u00a3244,649 inc VAT</strong> &nbsp;·&nbsp; No applications raised &nbsp;·&nbsp; 0% complete<br>
      * Provisional sums — expect uplifts once design confirmed (same pattern as Phase 1 P&amp;H +158%, Electrics +47%)</div>
    </div>
    <div class="twrap"><div class="tscroll"><table>
      <thead><tr><th style="padding:9px 12px;">Line Item</th><th style="padding:9px 12px;text-align:right;">Contract £</th><th style="padding:9px 12px;text-align:right;">% Claimed</th></tr></thead>
      <tbody>${rows}
        <tr style="background:var(--surface-2);font-weight:500;">
          <td style="padding:9px 12px;font-size:13px;">TOTAL (net)</td>
          <td style="padding:9px 12px;font-size:13px;text-align:right;">\u00a3203,874</td>
          <td style="padding:9px 12px;font-size:13px;text-align:right;">0%</td>
        </tr>
      </tbody>
    </table></div></div>
  </div>`;
}

function render(){
  const d=data[cur];
  document.getElementById('ttitle').textContent=cur;
  if(cur==='PHASE 2 TRACKER'){
    document.getElementById('rcount').textContent='';
    document.getElementById('tc').innerHTML=renderPhase2Dashboard();
    return;
  }
  if(!d){document.getElementById('tc').innerHTML='<div class="empty">Loading\u2026</div>';return;}
  const q=document.getElementById('search').value.toLowerCase().trim();
  const sc=STATCOL[cur];
  let rows=d.rows.filter(r=>!q||Object.values(r).some(v=>v&&v.toString().toLowerCase().includes(q)));
  document.getElementById('rcount').textContent=rows.length+' row'+(rows.length!==1?'s':'');
  const dashboard = cur==='BUDGET' ? renderBudgetDashboard() : '';
  if(!rows.length){document.getElementById('tc').innerHTML=dashboard+'<div class="twrap"><div class="empty">No rows found.</div></div>';return;}
  let h='<div class="twrap"><div class="tscroll"><table><thead><tr>';
  d.headers.forEach(c=>{h+='<th>'+esc(c)+'</th>';});
  h+='<th></th></tr></thead><tbody>';
  rows.forEach(row=>{
    const ri=d.rows.indexOf(row);h+='<tr>';
    d.headers.forEach(c=>{
      const v=row[c]||'';
      if(c===sc&&v){h+='<td class="cnarrow"><span class="badge '+bc(v)+'">'+esc(v)+'</span></td>';}
      else if(LONGCOLS.includes(c)||v.toString().length>60){const tr=v.toString().length>150?v.toString().slice(0,150)+'\u2026':v;h+='<td class="ctext" title="'+esc(v)+'">'+esc(tr)+'</td>';}
      else{h+='<td class="cnarrow">'+esc(v)+'</td>';}
    });
    h+='<td><div class="ract"><button class="ibtn" onclick="openEdit('+ri+')">Edit</button><button class="ibtn del" onclick="delRow('+ri+')">&times;</button></div></td></tr>';
  });
  h+='</tbody></table></div></div>';
  document.getElementById('tc').innerHTML=dashboard+h;
}

function buildFields(row){
  if(cur==='PHASE 2 TRACKER')return'<p style="color:var(--text-muted);font-size:13px;">Phase 2 is a read-only dashboard built from the quote spreadsheet.</p>';
  return(data[cur].headers||[]).map(h=>{
    const v=esc(row?(row[h]||''):'');
    const long=LONGCOLS.includes(h)||(row&&row[h]&&row[h].toString().length>80);
    return '<div class="field"><label>'+esc(h)+'</label>'+(long?'<textarea id="mf_'+h.replace(/\W/g,'_')+'" rows="3">'+v+'</textarea>':'<input type="text" id="mf_'+h.replace(/\W/g,'_')+'" value="'+v+'">')+'</div>';
  }).join('');
}

function getVals(){
  const row={};
  (data[cur].headers||[]).forEach(h=>{const el=document.getElementById('mf_'+h.replace(/\W/g,'_'));row[h]=el?el.value:'';});
  return row;
}

function openAdd(){editing=null;document.getElementById('mtitle').textContent='Add row \u2014 '+cur;document.getElementById('mfields').innerHTML=buildFields(null);document.getElementById('overlay').classList.add('open');}
function openEdit(i){if(cur==='PHASE 2 TRACKER')return;editing={row:data[cur].rows[i],idx:i};document.getElementById('mtitle').textContent='Edit row';document.getElementById('mfields').innerHTML=buildFields(editing.row);document.getElementById('overlay').classList.add('open');}
function closeModal(){document.getElementById('overlay').classList.remove('open');editing=null;}
function bgClick(e){if(e.target===document.getElementById('overlay'))closeModal();}

async function saveRow(){
  const btn=document.getElementById('saveBtn');btn.disabled=true;btn.textContent='Saving\u2026';
  try{
    const row=getVals();
    const r=editing
      ?await apiPost({action:'updateRow',tab:cur,keyColumn:KEYCOL[cur],keyValue:editing.row[KEYCOL[cur]],row})
      :await apiPost({action:'appendRow',tab:cur,row});
    if(r.success){closeModal();await loadAll();toast(editing?'Row updated':'Row added');}
    else toast('Failed: '+r.error,true);
  }catch(e){toast(e.message,true);}
  btn.disabled=false;btn.textContent='Save';
}

async function delRow(i){
  const row=data[cur].rows[i],kc=KEYCOL[cur],kv=row[kc];
  if(!confirm('Delete "'+kv+'"?'))return;
  try{
    const r=await apiPost({action:'deleteRow',tab:cur,keyColumn:kc,keyValue:kv});
    if(r.success){await loadAll();toast('Row deleted');}else toast('Failed: '+r.error,true);
  }catch(e){toast(e.message,true);}
}

let toastT;
function toast(msg,err){
  const el=document.getElementById('toast');el.textContent=msg;el.className='toast show'+(err?' err':'');
  clearTimeout(toastT);toastT=setTimeout(()=>{el.className='toast';},3500);
}
function showErr(m){const e=document.getElementById('errbanner');e.textContent=m;e.style.display='block';}
function hideErr(){document.getElementById('errbanner').style.display='none';}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
loadAll();
</script>
</body>
</html>
